name: Draft GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        type: string
      confirmation:
        description: Type CREATE DRAFT after final E2E approval
        required: true
        type: string

permissions:
  contents: write

jobs:
  draft-release:
    if: inputs.confirmation == 'CREATE DRAFT'
    runs-on: windows-latest
    environment: github-release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build staged runtime
        shell: powershell
        run: .\packaging\windows\build-stage.ps1
      - name: Fetch and verify Inno Setup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'inno-download'
          $install = Join-Path $env:RUNNER_TEMP 'inno-install'
          New-Item -ItemType Directory -Path $download,$install | Out-Null
          gh release download is-7_1_0 --repo jrsoftware/issrc --pattern innosetup-7.1.0-x64.exe --dir $download
          $asset = Join-Path $download 'innosetup-7.1.0-x64.exe'
          gh release verify-asset $asset --repo jrsoftware/issrc
          $signature = Get-AuthenticodeSignature -LiteralPath $asset
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Pyrsys B.V.') {
            throw 'Inno Setup Authenticode verification failed.'
          }
          & $asset /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER "/DIR=$install"
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          "ISCC_PATH=$(Join-Path $install 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile and verify installer
        shell: powershell
        run: .\packaging\windows\build-installer.ps1 -Version '${{ inputs.version }}' -IsccPath $env:ISCC_PATH
      - name: Create draft release
        shell: powershell
        run: |
          $version = '${{ inputs.version }}'
          gh release create "v$version" `
            .\packaging\windows\output\*.exe `
            .\packaging\windows\output\*.sha256 `
            .\packaging\windows\output\release-manifest.json `
            .\packaging\windows\stage\SBOM.cdx.json `
            .\packaging\windows\stage\THIRD_PARTY_NOTICES.md `
            --draft --generate-notes --title "v$version"
